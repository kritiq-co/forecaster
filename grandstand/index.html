<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grandstand</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2216%22%20height%3D%2216%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20width%3D%2216%22%20height%3D%2216%22%20fill%3D%22%230b0a12%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%222%22%20width%3D%2210%22%20height%3D%2210%22%20fill%3D%22%23f7d774%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%224%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%230b0a12%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%225%22%20width%3D%224%22%20height%3D%224%22%20fill%3D%22%23f7d774%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2212%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%23c9403a%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2212%22%20width%3D%223%22%20height%3D%223%22%20fill%3D%22%233b6ca8%22%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="A turn-based sports-quiz RPG. Retro pixel graphics, whole-number answers, and a car park full of 1980s sporting legends who want a word.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0b0a12;
    --panel:    #16131f;
    --panel-2:  #221d30;
    --panel-3:  #2e2742;
    --ink:      #e8e3f5;
    --ink-dim:  #9c93b8;
    --gold:     #f7d774;
    --green:    #4ade80;
    --red:      #f87171;
    --blue:     #60a5fa;
    --purple:   #c084fc;
    --line:     #3d3457;
    --head: 'Press Start 2P', ui-monospace, monospace;
    --body: 'Silkscreen', ui-monospace, monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: var(--body);
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  #app {
    width: 100%; max-width: 680px; height: 100%;
    display: flex; flex-direction: column;
    background: var(--bg);
  }

  /* ── top status bar ───────────────────────────────────────────── */
  #hud {
    display: none; gap: 6px; padding: 6px 8px;
    background: var(--panel); border-bottom: 3px solid var(--line);
    align-items: center; flex-wrap: wrap;
  }
  #hud.on { display: flex; }
  .gauge { flex: 1 1 90px; min-width: 76px; }
  .gauge-label {
    font-family: var(--head); font-size: 6px; letter-spacing: .5px;
    color: var(--ink-dim); display: flex; justify-content: space-between;
    margin-bottom: 3px;
  }
  .gauge-track { height: 8px; background: #0d0b14; border: 2px solid var(--line); }
  .gauge-fill { height: 100%; width: 100%; transition: width .28s steps(8); }
  .gauge-fill.energy { background: var(--gold); }
  .gauge-fill.cond   { background: var(--green); }
  .gauge-fill.cond.low { background: var(--red); }
  .rep-chip {
    font-family: var(--head); font-size: 8px; color: var(--gold);
    background: #0d0b14; border: 2px solid var(--line); padding: 5px 7px;
    white-space: nowrap;
  }
  #icon-btns { display: flex; gap: 4px; }

  /* ── the game canvas ──────────────────────────────────────────── */
  #stage {
    position: relative; width: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #07060d; overflow: hidden;
    border-bottom: 3px solid var(--line);
    flex: 0 0 auto; min-height: 120px;
  }
  #game {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #scanlines {
    position: absolute; inset: 0; pointer-events: none; opacity: .25;
    background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.55) 2px 3px);
  }
  #stage.shake { animation: shake .22s steps(3); }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    33% { transform: translate(-3px, 2px); }
    66% { transform: translate(3px, -2px); }
  }

  /* ── the panel below, where all the words live ────────────────── */
  #panel {
    flex: 1 1 auto; overflow-y: auto; padding: 10px;
    display: flex; flex-direction: column; gap: 9px;
    background: var(--panel);
    -webkit-overflow-scrolling: touch;
  }
  .screen { display: none; flex-direction: column; gap: 9px; }
  .screen.on { display: flex; }

  h1, h2, h3 { font-family: var(--head); margin: 0; font-weight: 400; }
  h1 { font-size: 20px; color: var(--gold); letter-spacing: 1px; line-height: 1.5; }
  h2 { font-size: 11px; color: var(--gold); letter-spacing: .5px; }
  h3 { font-size: 8px; color: var(--ink-dim); letter-spacing: .5px; }
  p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink); }
  .dim { color: var(--ink-dim); }
  .small { font-size: 13px; }

  /* ── buttons ──────────────────────────────────────────────────── */
  button {
    font-family: var(--head); font-size: 10px; line-height: 1.6;
    color: var(--ink); background: var(--panel-2);
    border: 3px solid var(--line); border-bottom-width: 5px;
    padding: 11px 12px; cursor: pointer; text-align: left;
    transition: none; letter-spacing: .3px;
  }
  button:hover:not(:disabled) { background: var(--panel-3); border-color: var(--gold); }
  button:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: #3f1f5c; border-color: var(--purple); color: #fff; }
  button.primary:hover:not(:disabled) { background: #52287a; border-color: var(--gold); }
  button.small-btn { font-size: 8px; padding: 7px 8px; }
  button.on { background: #1e4030; border-color: var(--green); color: var(--green); }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-row > button { flex: 1 1 auto; text-align: center; }
  .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }

  /* ── quiz options — the heart of the thing ────────────────────── */
  .q-prompt {
    font-family: var(--head); font-size: 11px; line-height: 1.8;
    color: var(--ink); background: var(--panel-2);
    border: 3px solid var(--line); border-left: 6px solid var(--gold);
    padding: 11px 12px;
  }
  .q-prompt.block { border-left-color: var(--blue); }
  .q-hint {
    font-family: var(--head); font-size: 7px; letter-spacing: 1px;
    color: var(--gold); text-align: center; padding: 4px 0 1px;
  }
  .q-hint.block { color: var(--blue); }
  .q-mode {
    font-family: var(--head); font-size: 8px; letter-spacing: 1px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .q-mode .strike { color: var(--gold); }
  .q-mode .block  { color: var(--blue); }

  .opt {
    display: flex; align-items: center; gap: 10px; width: 100%;
    font-family: var(--body); font-size: 17px; font-weight: 700;
    padding: 12px; text-align: left;
  }
  .opt .num {
    font-family: var(--head); font-size: 10px; color: var(--gold);
    background: #0d0b14; border: 2px solid var(--line);
    width: 26px; height: 26px; display: grid; place-items: center; flex: 0 0 auto;
  }
  .opt .label { flex: 1 1 auto; }
  .opt.gone { opacity: .22; text-decoration: line-through; pointer-events: none; }
  .opt.reveal-best { border-color: var(--green); background: #14301f; }
  .opt.reveal-picked { border-color: var(--gold); }
  .opt.reveal-picked.bad { border-color: var(--red); background: #351a1f; }
  .opt .val {
    font-family: var(--head); font-size: 11px; color: var(--green);
    opacity: 0; transition: opacity .1s;
  }
  .opt.revealed .val { opacity: 1; }

  /* ── timer ────────────────────────────────────────────────────── */
  #timer-track {
    height: 10px; background: #0d0b14; border: 2px solid var(--line); overflow: hidden;
  }
  #timer-fill { height: 100%; width: 100%; background: var(--green); }
  #timer-fill.warn { background: var(--gold); }
  #timer-fill.panic { background: var(--red); }

  /* ── fighter HP bars ──────────────────────────────────────────── */
  .fighter-bar { display: flex; flex-direction: column; gap: 3px; }
  .fighter-bar .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .fighter-bar .nm { font-family: var(--head); font-size: 9px; }
  .fighter-bar .hpnum { font-family: var(--head); font-size: 8px; color: var(--ink-dim); }
  .hp-track { height: 10px; background: #0d0b14; border: 2px solid var(--line); }
  .hp-fill { height: 100%; background: var(--green); transition: width .3s steps(10); }
  .hp-fill.foe { background: var(--red); }
  .hp-fill.hurt { background: var(--gold); }
  .epithet { font-size: 12px; color: var(--ink-dim); font-style: italic; }

  /* ── d-pad ────────────────────────────────────────────────────── */
  #pad-wrap { display: flex; gap: 12px; align-items: center; }
  #minimap {
    image-rendering: pixelated; flex: 1 1 auto; min-width: 0;
    max-width: 260px; height: auto;
    border: 3px solid var(--line); background: #0b0a12;
  }
  #dpad {
    display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 44px);
    gap: 3px; flex: 0 0 auto;
  }
  #dpad button { padding: 0; display: grid; place-items: center; font-size: 13px; }
  #dpad .spacer { visibility: hidden; }
  #map-info { display: flex; flex-direction: column; gap: 6px; }

  /* ── misc ─────────────────────────────────────────────────────── */
  .card {
    background: var(--panel-2); border: 3px solid var(--line); padding: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .card.gold { border-color: var(--gold); }
  .card.red { border-color: var(--red); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px,1fr)); gap: 6px; }
  .stat { background: #0d0b14; border: 2px solid var(--line); padding: 7px; }
  .stat .k { font-family: var(--head); font-size: 6px; color: var(--ink-dim); display: block; margin-bottom: 4px; }
  .stat .v { font-family: var(--head); font-size: 13px; color: var(--gold); }
  .feedback { font-family: var(--head); font-size: 13px; line-height: 1.6; }
  .feedback.good { color: var(--green); }
  .feedback.bad  { color: var(--red); }
  .feedback.mid  { color: var(--gold); }
  .note { font-size: 14px; color: var(--ink-dim); line-height: 1.5; border-left: 3px solid var(--line); padding-left: 8px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px;
    background: var(--panel-2); border: 3px solid var(--gold); color: var(--gold);
    font-family: var(--head); font-size: 9px; padding: 9px 12px; z-index: 50;
    pointer-events: none;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { font-family: var(--head); font-size: 7px; color: var(--ink-dim); text-align: left; padding: 5px 4px; }
  td { padding: 6px 4px; border-top: 2px solid var(--line); }
  td.n { font-family: var(--head); font-size: 9px; color: var(--gold); }
  .kbd {
    font-family: var(--head); font-size: 7px; color: var(--ink-dim);
    border: 2px solid var(--line); padding: 2px 4px; background: #0d0b14;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .warn-strip {
    font-size: 12px; color: #0b0a12; background: var(--gold);
    padding: 5px 8px; font-weight: 700;
  }

  @media (max-width: 420px) {
    h1 { font-size: 15px; }
    .q-prompt { font-size: 10px; line-height: 1.7; }
    .opt { font-size: 15px; }
    #dpad { grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 38px); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="gauge">
      <div class="gauge-label"><span>ENERGY</span><span id="energy-num">110</span></div>
      <div class="gauge-track"><div class="gauge-fill energy" id="energy-fill"></div></div>
    </div>
    <div class="gauge">
      <div class="gauge-label"><span>CONDITION</span><span id="cond-num">120</span></div>
      <div class="gauge-track"><div class="gauge-fill cond" id="cond-fill"></div></div>
    </div>
    <div class="rep-chip" id="rep-chip">REP 0</div>
    <div id="icon-btns">
      <button class="small-btn" id="btn-sound" title="Sound">♪</button>
      <button class="small-btn" id="btn-quit" title="End the day">✕</button>
    </div>
  </div>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="scanlines"></div>
  </div>

  <div id="panel"><!-- screens injected by main.js --></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
